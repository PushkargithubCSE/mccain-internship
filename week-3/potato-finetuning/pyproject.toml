[project]
name = "potato-finetuning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "pushkarchandra2005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=0.25.0",
    "kaggle>=1.6.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "opencv-python>=4.8.0",
    "pandas>=2.1.0",
    "peft>=0.7.0",
    "pillow>=10.1.0",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.0",
    "timm>=0.9.12",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "tqdm>=4.66.0",
    "transformers>=4.36.0",
    "wandb>=0.16.0",
]

[project.scripts]
potato-finetuning = "potato_finetuning:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
