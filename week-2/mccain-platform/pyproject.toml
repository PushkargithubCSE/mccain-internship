[project]
name = "mccain-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "pushkarchandra2005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[project.scripts]
mccain-platform = "mccain_platform:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
